# The Gradle distribution comes from the Myket mirror: services.gradle.org is
# unreachable from this network, and the mirror serves the same archive. The
# official URL is kept below as a comment, for a machine that can reach it.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https://maven.myket.ir/gradle/distributions/gradle-8.13-bin.zip
# distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
networkTimeout=60000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Regenerate the offline app UI
        run: python3 build_apk_ui.py

      - name: Sync the chatbot data into the app assets
        run: |
          cp memory.json glossary.json grammar.json phrases.json jokes.json \
             listening.json android/app/src/main/assets/www/data/

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fluentify-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
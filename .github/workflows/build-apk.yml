name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check the Android sources before spending 5 minutes on Gradle
        # Neither AAPT nor kotlinc runs until the Gradle step, and two build
        # failures have shipped that only CI could see - a misspelled android:
        # attribute and an elvis fallback that widened an Intent to Any. These
        # catch both classes first, in a second.
        run: |
          python3 tools/check_manifest.py
          python3 tools/check_kotlin.py

      - name: Regenerate the offline app UI and sync its data
        # build_apk_ui.py owns the data/ sync - it copies every file the
        # offline boot fetches and fails if one is missing. Listing the files
        # here as well only created a second place to forget one.
        run: python3 build_apk_ui.py

      - name: Run the check suite
        run: python3 tools/check_all.py

      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee /tmp/gradle.log

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fluentify-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error